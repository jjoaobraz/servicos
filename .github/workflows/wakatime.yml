name: Update WakaTime Stats

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch WakaTime stats
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          curl -sf "https://wakatime.com/api/v1/users/current/stats/last_7_days" \
            -H "Authorization: Basic $(printf '%s' "$WAKATIME_API_KEY" | base64 -w 0)" \
          | python3 - <<'EOF'
          import json, sys

          raw = sys.stdin.read()
          data = json.loads(raw).get('data', {})

          langs = data.get('languages', [])
          top   = langs[0]['name'] if langs else 'N/A'

          result = {
            'total_seconds': data.get('total_seconds', 0),
            'text':          data.get('human_readable_total', '0 hrs'),
            'top_language':  top,
            'updated_at':    data.get('modified_at'),
          }

          with open('wakatime.json', 'w') as f:
              json.dump(result, f, indent=2)
              f.write('\n')
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wakatime.json
          git diff --staged --quiet || git commit -m "chore: update wakatime stats"
          git push
